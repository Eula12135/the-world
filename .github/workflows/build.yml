name: Build Desktop & Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: npm run typecheck
      - run: npm test

  build-desktop:
    needs: test-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - name: Build Web & Electron
        env:
          VITE_UPDATE_REPO: ${{ github.repository }}
        run: npm run build && npm run build:electron
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: release/*

  build-android:
    needs: test-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile || pnpm install
      - name: Sync Android Web Bundle
        env:
          VITE_UPDATE_REPO: ${{ github.repository }}
        run: npm run android:sync
      - name: Build Android Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk

  publish-release:
    needs: [build-desktop, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: raw-artifacts
      - name: Prepare Release Assets & latest.json
        run: |
          mkdir -p release-assets
          find raw-artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          if [ -f raw-artifacts/android-apk/app-debug.apk ]; then
            cp raw-artifacts/android-apk/app-debug.apk "release-assets/The-World-${GITHUB_REF_NAME}-android.apk"
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          BASE_DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          APK_FILE=$(ls release-assets/*.apk 2>/dev/null | head -n1 | xargs -r basename)
          WIN_FILE=$(ls release-assets/*Setup*.exe 2>/dev/null | head -n1 | xargs -r basename)
          cat > release-assets/latest.json <<EOF
          {
            "version": "${VERSION}",
            "releaseUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}",
            "androidUrl": "${APK_FILE:+${BASE_DL}/${APK_FILE}}",
            "windowsUrl": "${WIN_FILE:+${BASE_DL}/${WIN_FILE}}",
            "notes": "Release ${GITHUB_REF_NAME}"
          }
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
