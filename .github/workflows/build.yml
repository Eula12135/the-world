name: Build Checks (no release)

on:
  # 只校验「能不能构建」，绝不发布。发布由本地受控脚本执行：
  #   npm run release:gitee + gh release create + npm run verify:release
  # 历史上 tag 触发 CI 自动发版，覆盖过正式 APK（见 docs/UNRELEASED.md）
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: npm run typecheck
      - run: npm test

  build-desktop:
    needs: test-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - name: Build Web & Electron
        env:
        run: npm run build && npm run build:electron
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: release/*

  build-android:
    needs: test-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # 注意：不要用默认的 "tools platform-tools"。
      # Google 已废弃 legacy "tools" 包（由 cmdline-tools 取代），sdkmanager 会以
      # "Failed to find package 'tools'" 退出 1，导致整个 job 失败。
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: pnpm install --frozen-lockfile || pnpm install
      - name: Sync Android Web Bundle
        env:
        run: npm run android:sync

      # 有 release keystore 就打正式签名包；没有则退回 debug，且不发布为正式版
      - name: Detect release keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "已检测到 release keystore，将构建正式签名包"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次只构建 debug 包，不会作为正式版发布"
          fi

      - name: Prepare release signing
        if: steps.keystore.outputs.available == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/the-world-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/the-world-release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          chmod 600 keystore.properties keystore/the-world-release.jks

      - name: Build Android Release APK
        if: steps.keystore.outputs.available == 'true'
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Build Android Debug APK (未配置签名，仅供内部测试)
        if: steps.keystore.outputs.available != 'true'
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
